name: CI

on:
  push:
    branches: [main, cursor/**]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Spotless check
        run: ./gradlew spotlessCheck --stacktrace

      - name: Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Review feature unit tests
        run: ./gradlew :feature:review:testDebugUnitTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: UI instrumentation (managed device)
        run: >
          ./gradlew :feature:review:frrTabletApi30DebugAndroidTest
          --stacktrace
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Phase 1 verification
        run: ./gradlew :app:verifyPhase1 --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/outputs/lint-results-*.xml
            **/build/outputs/lint-results-*.html
          if-no-files-found: ignore
